name: Deploy to GitHub Pages

# No `test` job — there's no application code here, just the docs site (see
# tsmap's/wafermap's own deploy.yml for the pattern this is modeled on, where
# a `test` job gates the deploy; this repo has nothing equivalent to gate on).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Zensical
        run: pip install -r requirements.txt

      - name: Build documentation site
        run: zensical build --clean

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deployment
